<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibley 2.1</title>
<style>
  :root { --gold: #e8b64c; --bg: #0b1020; --panel: #101a33; --line: #22304f; --text: #dfe6f5; --dim: #8fa0c4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #0b1020 0%, #0d1426 100%); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh;
         display: flex; flex-direction: column; }
  header { flex-wrap: wrap; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 26px; color: var(--gold); letter-spacing: .5px; }
  header span { color: var(--dim); font-size: 13px; }
  #status { max-width: 760px; width: 100%; margin: 0 auto; padding: 10px 18px 0; color: var(--dim); font-size: 13px; }
  #status.ready { color: #7fd49a; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; font-size: 15px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--gold); color: #1a1206; border-bottom-right-radius: 4px; font-weight: 600; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; font-family: Georgia, "Times New Roman", serif; }
  .msg.note { align-self: center; background: none; border: none; color: var(--dim); font-size: 12px; font-family: inherit; }
  .hint { align-self: center; color: var(--dim); font-size: 13px; text-align: center; max-width: 540px; margin-top: 30px; line-height: 1.7; }
  .hint b { color: var(--gold); font-weight: 600; }
  form { display: flex; gap: 10px; padding: 14px 18px 18px; max-width: 760px; width: 100%; margin: 0 auto; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text);
                     padding: 13px 16px; border-radius: 12px; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: var(--gold); }
  input[type=text]:disabled { opacity: .5; }
  button.send { background: var(--gold); color: #1a1206; border: none; padding: 13px 22px; border-radius: 12px;
                font-size: 15px; font-weight: 700; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><h1>Bibley 2.1</h1><span>Oliver's local Bible assistant</span></header>
<div id="status">Waking up...</div>
<div id="log">
  <div class="hint"><b>Bibley 2.1</b> looks up the real King James verses first, then answers.<br><br>
  Try: <b>What does John 3:16 say?</b> or <b>what does the Bible say about worry?</b><br><br>
  Response time depends on your device and setup.</div>
</div>
<form id="f">
  <input type="text" id="q" placeholder="Ask a Bible question..." autocomplete="off" autofocus disabled>
  <button id="send" class="send" type="submit" disabled>Send</button>
</form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'),
      q = document.getElementById('q'), send = document.getElementById('send'),
      status = document.getElementById('status');
let ready = false;

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function poll() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    status.textContent = s.error ? ('Problem: ' + s.error) : s.stage;
    if (s.ready && !ready) {
      ready = true;
      status.className = 'ready';
      status.textContent = 'Ready - ask away.';
      q.disabled = send.disabled = false;
      q.focus();
      loadHistory();
      return;
    }
    if (s.error) { status.style.color = '#e87a7a'; return; }
  } catch (err) {
    status.textContent = 'Cannot reach Bibley - is the Terminal window still open?';
  }
  setTimeout(poll, 1000);
}

async function loadHistory() {
  try {
    const r = await fetch('/api/history');
    const data = await r.json();
    if (data.history && data.history.length) {
      log.innerHTML = '';
      data.history.forEach(h => {
        add('user', h.q);
        add('ai', h.a);
        if (h.verses && h.verses.length) add('note', 'Verses used: ' + h.verses.join(', '));
      });
    }
  } catch (err) {}
}

f.onsubmit = async (e) => {
  e.preventDefault();
  const prompt = q.value.trim();
  if (!prompt) return;
  q.value = '';
  if (log.querySelector('.hint')) log.innerHTML = '';
  add('user', prompt);
  const thinking = add('ai', 'Bibley is looking up verses and thinking... (can take a minute or two)');
  send.disabled = true;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await r.json();
    thinking.textContent = data.reply || data.error || 'Something went wrong.';
    if (data.reply && data.verses && data.verses.length)
      add('note', 'Verses used: ' + data.verses.join(', '));
  } catch (err) {
    thinking.textContent = 'Could not reach Bibley - is the Terminal window still open?';
  }
  send.disabled = false;
  q.focus();
};

poll();
</script>
</body>
</html>
